# Project Supabase gratis berhenti otomatis setelah 7 hari tanpa aktivitas.
# Ping dua kali seminggu jauh lebih murah daripada menemukan dashboard mati
# tepat saat dibutuhkan.
#
# Perlu dua secret di Settings > Secrets and variables > Actions:
#   SUPABASE_URL       https://xxxx.supabase.co
#   SUPABASE_ANON_KEY  anon public key
name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 2 * * 1,4'   # Senin & Kamis, 09:00 WIB
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping REST endpoint
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SB_URL" ]; then
            echo "SUPABASE_URL belum diatur - lewati."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "$SB_URL/rest/v1/workspaces?select=id&limit=1" \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY")
          echo "HTTP $code"
          # 200 dan 401 sama-sama membuktikan project hidup; yang berbahaya
          # justru diam tanpa jawaban.
          if [ "$code" = "000" ]; then
            echo "Tidak ada jawaban - project mungkin ter-pause."
            exit 1
          fi
